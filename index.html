<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ramo de flores amarillas</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #000000;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    background: #000000;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 15px 10px;

    overflow-x: hidden;

    font-family: Georgia, 'Times New Roman', serif;
}


/* =========================================
   PANTALLA DE CONTRASEÑA
========================================= */

#pantalla-codigo {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    background: #000000;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 20px;

    z-index: 9999;

    padding: 30px 20px;
}

#pantalla-codigo h1 {
    color: #FFFFFF;

    font-size: clamp(22px, 5vw, 42px);

    font-weight: bold;

    text-align: center;

    letter-spacing: 0.05em;

    margin-bottom: 6px;
}

#pantalla-codigo p {
    color: #FFFFFF;

    font-size: clamp(13px, 2.3vw, 18px);

    text-align: center;

    opacity: 0.85;
}

#pantalla-codigo input {
    background: transparent;

    border: none;
    border-bottom: 2px solid #FFFFFF;

    color: #FFFFFF;

    font-family: inherit;

    font-size: clamp(22px, 4.5vw, 36px);

    text-align: center;

    padding: 6px 12px;

    width: min(100%, 280px);

    outline: none;

    letter-spacing: 0.15em;

    caret-color: #FFD15A;
}

#pantalla-codigo input::placeholder {
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.15em;
}

#pantalla-codigo button {
    background: #FFD15A;

    color: #000000;

    border: none;

    font-family: inherit;

    font-size: clamp(15px, 2.3vw, 20px);

    font-weight: bold;

    padding: 10px 34px;

    border-radius: 40px;

    cursor: pointer;

    transition: transform 0.2s ease, background 0.2s ease;

    letter-spacing: 0.05em;
}

#pantalla-codigo button:hover {
    background: #FFE18A;
    transform: scale(1.05);
}

#pantalla-codigo button:active {
    transform: scale(0.98);
}

#mensaje-error {
    color: #FF3B30;

    font-size: clamp(13px, 1.8vw, 16px);

    min-height: 22px;

    text-align: center;

    font-weight: bold;

    letter-spacing: 0.05em;
}


/* =========================================
   CONTENIDO PRINCIPAL
========================================= */

#contenido-principal {
    display: none;

    width: 100%;

    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#contenido-principal.visible {
    display: flex;
}


/* =========================================
   TEXTOS EN FORMA DE ARCO
   Reducidos para móvil
========================================= */

.texto-arriba,
.texto-abajo {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;

    font-size: clamp(11px, 2.3vw, 26px);
    font-weight: bold;
    letter-spacing: 0.02em;

    margin: 10px 0;

    user-select: none;

    white-space: nowrap;
}

.texto-arriba {
    align-items: flex-end;
}

.texto-abajo {
    align-items: flex-start;
}

.texto-arriba span,
.texto-abajo span {
    display: inline-block;

    color: #FFFFFF;

    opacity: 0;

    animation:
        aparecerLetra 0.4s
        ease-out
        forwards;
}

@keyframes aparecerLetra {

    from {
        opacity: 0;
        transform: translateY(12px) scale(0.85);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================
   CONTENEDOR DEL RAMO
   Reducido para que quepa en móvil
========================================= */

.ramo {
    width: min(85%, 420px);
    margin: 10px auto;
}

svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
}


/* =========================================
   ANIMACIÓN DE LAS FLORES
========================================= */

.flor {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        aparecerFlor 2.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
}

@keyframes aparecerFlor {

    0% {
        opacity: 0;
        transform: translateY(22px) scale(0.5);
    }

    60% {
        opacity: 1;
        transform: translateY(-4px) scale(1.05);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================
   APARICIÓN DEL PAPEL
========================================= */

.papel {
    opacity: 0;

    animation:
        aparecerPapel 1.4s
        ease-out 0.2s
        forwards;
}

@keyframes aparecerPapel {
    from { opacity: 0; }
    to   { opacity: 1; }
}


/* =========================================
   APARICIÓN DEL LAZO
========================================= */

.lazo {
    opacity: 0;

    animation:
        aparecerLazo 1.4s
        ease-out 1.6s
        forwards;
}

@keyframes aparecerLazo {
    from { opacity: 0; }
    to   { opacity: 1; }
}


/* =========================================
   APARICIÓN DE TALLOS Y HOJAS
========================================= */

.tallos-arriba,
.tallos-abajo,
.hojas {
    opacity: 0;

    animation:
        aparecerTallos 1.4s
        ease-out 3.0s
        forwards;
}

@keyframes aparecerTallos {
    from { opacity: 0; }
    to   { opacity: 1; }
}


/* =========================================
   APARICIÓN ALTERNADA DE LAS FLORES
========================================= */

.f1  { animation-delay: 4.4s; }
.f20 { animation-delay: 4.95s; }
.f2  { animation-delay: 5.5s; }
.f19 { animation-delay: 6.05s; }
.f3  { animation-delay: 6.6s; }
.f18 { animation-delay: 7.15s; }
.f4  { animation-delay: 7.7s; }
.f17 { animation-delay: 8.25s; }
.f5  { animation-delay: 8.8s; }
.f16 { animation-delay: 9.35s; }
.f6  { animation-delay: 9.9s; }
.f15 { animation-delay: 10.45s; }
.f7  { animation-delay: 11.0s; }
.f14 { animation-delay: 11.55s; }
.f8  { animation-delay: 12.1s; }
.f13 { animation-delay: 12.65s; }
.f9  { animation-delay: 13.2s; }
.f12 { animation-delay: 13.75s; }
.f10 { animation-delay: 14.3s; }
.f11 { animation-delay: 15.4s; }


/* =========================================
   AJUSTES ESPECÍFICOS PARA MÓVIL
========================================= */

@media (max-width: 480px) {

    body {
        padding: 10px 6px;
    }

    .ramo {
        width: 80%;
        margin: 6px auto;
    }

    .texto-arriba,
    .texto-abajo {
        margin: 6px 0;
        font-size: clamp(10px, 2.5vw, 14px);
    }

}


/* =========================================
   REDUCCIÓN DE MOVIMIENTO
========================================= */

@media (prefers-reduced-motion: reduce) {

    .flor,
    .papel,
    .lazo,
    .tallos-arriba,
    .tallos-abajo,
    .hojas,
    .texto-arriba span,
    .texto-abajo span {

        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        opacity: 1;

    }

}

</style>

<!-- =================================================
     SCRIPT: VALIDACIÓN DEL CÓDIGO
================================================= -->

<script>

(function () {

    var CODIGO_CORRECTO = "21/09";

    var pantallaCodigo = document.getElementById("pantalla-codigo");
    var contenido      = document.getElementById("contenido-principal");
    var input          = document.getElementById("input-codigo");
    var boton          = document.getElementById("boton-validar");
    var mensajeError   = document.getElementById("mensaje-error");

    function validar() {

        var valor = input.value.trim();

        if (valor === CODIGO_CORRECTO) {

            pantallaCodigo.style.display = "none";
            contenido.classList.add("visible");

        } else {

            mensajeError.textContent = "Código incorrecto. Inténtalo otra vez.";

            input.value = "";
            input.focus();

        }

    }

    boton.addEventListener("click", validar);

    input.addEventListener("keydown", function (evento) {

        if (evento.key === "Enter") {
            validar();
        }

    });

    input.addEventListener("input", function () {

        var v = input.value.replace(/[^0-9]/g, "");

        if (v.length > 4) {
            v = v.substring(0, 4);
        }

        if (v.length >= 3) {
            input.value = v.substring(0, 2) + "/" + v.substring(2);
        } else if (v.length === 2) {
            input.value = v + "/";
        } else {
            input.value = v;
        }

    });

    input.focus();

})();

</script>
